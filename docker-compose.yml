services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-Edu-verseDB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./documentacion/backup_BASE_DE_DATOS.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./edu-verse_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-Edu-verseDB}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_eduverse_2026}
      # Tutor IA (Groq). La API key solo vive en el backend.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_RESPALDO: ${GROQ_MODEL_RESPALDO:-openai/gpt-oss-20b}
      TUTOR_LIMITE_POR_MINUTO: ${TUTOR_LIMITE_POR_MINUTO:-10}
    volumes:
      - uploads:/app/uploads
      - ./edu-verse_backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./edu-verse
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./edu-verse/src:/app/src
      - ./edu-verse/public:/app/public
      - ./edu-verse/index.html:/app/index.html
      - ./edu-verse/vite.config.js:/app/vite.config.js
      - ./edu-verse/tailwind.config.js:/app/tailwind.config.js
      - ./edu-verse/postcss.config.js:/app/postcss.config.js
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
