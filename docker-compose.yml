# Configuración de PRODUCCIÓN: backend con Node (sin nodemon), frontend
# compilado y servido por Nginx, y PostgreSQL sin puerto publicado al host.
# Para desarrollo con hot-reload usa: docker compose -f docker-compose.dev.yml up
name: edu-verse

services:
  postgres:
    # pgvector/pgvector:pg16 = PostgreSQL 16 + extensión vector (búsqueda
    # semántica del Tutor IA). Misma versión mayor: los datos se conservan.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raiz}
      POSTGRES_DB: ${DB_NAME:-Edu-verseDB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./documentacion/backup_BASE_DE_DATOS.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME:-Edu-verseDB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin ports: solo es accesible desde la red interna de Docker.

  backend:
    build:
      context: ./edu-verse_backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-Edu-verseDB}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raiz}
      DB_PORT: 5432
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env de la raiz}
      UPLOAD_QUOTA_MB: ${UPLOAD_QUOTA_MB:-100}
      # Tutor IA (Groq). La API key solo vive en el backend.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_RESPALDO: ${GROQ_MODEL_RESPALDO:-openai/gpt-oss-20b}
      TUTOR_LIMITE_POR_MINUTO: ${TUTOR_LIMITE_POR_MINUTO:-10}
    volumes:
      - uploads:/app/uploads
      - modelos:/modelos
    # Solo accesible desde el propio host (para depurar); el tráfico público
    # entra por Nginx en el servicio frontend.
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4001}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker del Tutor IA: extrae el texto de los apuntes (PDF y OCR) para que el
  # tutor pueda buscarlos. Misma imagen que el backend, otro comando, para que
  # el OCR no bloquee la API.
  worker:
    build:
      context: ./edu-verse_backend
      target: production
    restart: unless-stopped
    command: ["node", "worker/indexador.js"]
    environment:
      NODE_ENV: production
      DB_USER: postgres
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-Edu-verseDB}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env de la raiz}
      DB_PORT: 5432
    volumes:
      # Lee los mismos archivos que sube el backend.
      - uploads:/app/uploads:ro
      - modelos:/modelos
    depends_on:
      postgres:
        condition: service_healthy
      # El backend aplica las migraciones al arrancar.
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./edu-verse
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  # Caché del modelo de embeddings (~120 MB): se descarga una sola vez.
  modelos:
