server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las subidas de apuntes permiten hasta 10 MB; el default de Nginx es 1 MB.
    client_max_body_size 12m;

    # API REST: todo lo que consume axios en el mismo origen.
    location ~ ^/(auth|apuntes|favoritos|usuarios|comentarios|valoraciones|equipos|tareas|chat|admin)(/|$) {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos subidos (apuntes y fotos de perfil).
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO necesita Upgrade/Connection y un timeout largo.
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: cualquier ruta de React Router cae al index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
